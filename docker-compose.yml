services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: month3-api:day086
    container_name: month3-api
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    depends_on:
      - redis
    restart: unless-stopped
    dns:
      - 100.100.100.100
      - 223.5.5.5
  redis:
    image: redis:7
    container_name: month3-redis
    restart: unless-stopped
  worker:
      image: month3-api:day086
      container_name: month3-worker
      command: python -m app.worker
      volumes:
        - ./logs:/app/logs
      env_file:
        - .env
      environment:
        REDIS_HOST: redis
        REDIS_PORT: "6379"
        REDIS_DB: "0"
      depends_on:
        - redis
      restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    container_name: month3-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
    restart: unless-stopped
