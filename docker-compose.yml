services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: month3-api:day116
    container_name: month3-api
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-month3}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-month3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  redis:
    image: redis:7
    container_name: month3-redis
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    container_name: month3-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-month3}
      POSTGRES_USER: ${POSTGRES_USER:-month3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
      image: month3-api:day116
      container_name: month3-worker
      command: python -m app.worker
      volumes:
        - ./logs:/app/logs
      env_file:
        - .env
      environment:
        REDIS_HOST: redis
        REDIS_PORT: "6379"
        REDIS_DB: "0"
        DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-month3}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-month3}
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_started
      restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    container_name: month3-nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
